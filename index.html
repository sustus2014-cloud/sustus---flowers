DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>סוס-טוס פרחים 🌸</title>
<meta name="theme-color" content="#ec4899">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;direction:rtl;padding-bottom:110px;background:#fdf2f8}
.h{padding:12px 16px;background:#fff;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ec4899}
.h img{width:64px;height:64px;object-fit:cover;border-radius:50%;border:2px solid #f9a8d4}
.big{font-size:24px;font-weight:900;line-height:1.1}.pink{color:#ec4899}
#map{height:360px;margin:12px 16px;border-radius:16px;border:1px solid #fbcfe8;z-index:1}
.card{margin:10px 16px;border:1px solid #fbcfe8;border-radius:16px;padding:14px;background:#fff}
.topstats{display:flex;gap:8px;padding:0 16px}.stat{flex:1;background:#fff;border:1px solid #fbcfe8;border-radius:12px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.b1{border:1px solid #ec4899;color:#be185d;background:#fff;padding:9px 14px;border-radius:10px;font-weight:700}.b2{background:#ec4899;color:#fff;border:0;padding:9px 14px;border-radius:10px;font-weight:700}
.wa{width:100%;margin-top:8px;background:#25D366;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:800;display:block;text-align:center;text-decoration:none;font-size:16px}
.callBtn{width:100%;margin-top:8px;background:#111;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:800;display:block;text-align:center;text-decoration:none;font-size:16px}
.move{display:flex;gap:8px;margin-top:10px}.move button{flex:1;padding:12px;border-radius:10px;border:1px solid #ec4899;background:#fff;font-weight:800;font-size:16px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #fbcfe8;padding:12px;z-index:10}.nav div{color:#888;font-size:14px;text-align:center}.nav .on{color:#ec4899;font-weight:800}
.tab{display:none}.tab.on{display:block}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:6px;font-size:15px}
.prog{height:10px;background:#fce7f3;border-radius:20px;overflow:hidden;margin:8px 16px}.prog div{height:100%;background:#ec4899}
.navBtns{display:flex;gap:8px;margin-top:8px}.navBtns a{flex:1;text-align:center;padding:12px;border-radius:10px;font-weight:800;text-decoration:none;color:#fff}
.mapSwitch{display:flex;gap:8px;padding:0 16px}.mapSwitch button{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:700}.mapSwitch button.on{background:#ec4899;color:#fff;border-color:#ec4899}
.nextBtn{margin:0 16px;background:#ec4899;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800;font-size:16px;width:calc(100% - 32px)}
.installBar{background:#111;color:#fff;padding:12px 16px;margin:8px 16px;border-radius:12px;display:none;justify-content:space-between;align-items:center}.installBar button{background:#ec4899;border:0;color:#fff;padding:8px 14px;border-radius:8px;font-weight:800}
.moneyBox{background:#fff;border:2px solid #ec4899;border-radius:16px;padding:16px;margin:10px 16px;text-align:center}.moneyBox b{font-size:28px;color:#be185d}
  <div id="t3" class="tab"><h3 style="padding:0 16px">💰 כסף</h3>
<div class="moneyBox"><small>💰 היום - <span id="todayDate"></span></small><br><b id="moneyToday">0₪</b><br><small id="moneyTodayDetail"></small></div>
<div class="moneyBox"><small>📅 החודש - <span id="monthName"></span></small><br><b id="moneyMonth">0₪</b><br><small id="moneyMonthDetail"></small></div>
<div class="card"><b>מחיר לסחורה / הזמנה:</b><input id="pricePer" type="number" value="150" onchange="savePrice();render()"><br><small>המחיר נשמר אוטומטית</small></div>
<div style="padding:0 16px"><button class="reportBtn" onclick="sendDailyReport()">📊 דו"ח סיכום יומי להגשה</button><button class="reportBtn" style="background:#111" onclick="sendMonthlyReport()">📅 דו"ח סיכום חודשי להגשה</button><button class="reportBtn" style="background:#ec4899" onclick="copyDailyReport()">📋 העתק דו"ח יומי</button></div>
<div class="card"><b>📜 היסטוריה</b><div id="historyList" style="font-size:14px"></div></div>
</div>
<div id="t4" class="tab"><h3 style="padding:0 16px">✅ הוכחות</h3><div class="card">📸 צילום הוכחת מסירה <input type="file" accept="image/*"></div></div>
<div id="t5" class="tab"><h3 style="padding:0 16px">⚙️ הגדרות</h3><div class="card"><b>💬 הודעת וואטסאפ שלך</b><textarea id="msgTemplate" rows="3" onchange="saveMsg()">היי {שם} 🌸 סוס-טוס בדרך אליך עם הסחורה! מגיע בעוד כ-20 דקות. גיא - 052-8671331</textarea></div><div class="card"><b>🛠️ תיקונים</b><br><br><button onclick="fixPhones()" style="width:100%;background:#25D366;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:800;margin-top:6px">📞 תקן את כל המספרים</button><button onclick="spreadInHarish()" style="width:100%;background:#111;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:800;margin-top:8px">↔️ פזר נקודות על חריש</button></div></div>
<div class="nav"><div class="on" onclick="go(1,this)">קו היום</div><div onclick="go(2,this)">הוסף</div><div onclick="go(3,this)">💰 כסף</div><div onclick="go(4,this)">הוכחות</div><div onclick="go(5,this)">⚙️ הגדרות</div></div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBar').style.display='flex';});
document.getElementById('installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBar').style.display='none';}else{alert('כדי להתקין: 3 נקודות למעלה בכרום > הוסף למסך הבית');}});
let parcels=[]; try{let s=localStorage.getItem('sustus_flowers_v2'); if(s) parcels=JSON.parse(s);}catch(e){}
function saveParcels(){try{localStorage.setItem('sustus_flowers_v2',JSON.stringify(parcels));}catch(e){}}
const DEFAULT_MSG='היי {שם} 🌸 סוס-טוס בדרך אליך עם הסחורה! מגיע בעוד כ-20 דקות. גיא - 052-8671331';
function getMsg(name){let t=localStorage.getItem('sustus_flowers_msg')||DEFAULT_MSG; return t.replaceAll('{שם}',name).replaceAll('{name}',name);}
function saveMsg(){localStorage.setItem('sustus_flowers_msg',document.getElementById('msgTemplate').value);}
try{let saved=localStorage.getItem('sustus_flowers_msg'); if(saved) document.getElementById('msgTemplate').value=saved;}catch(e){}
function getPrice(){return parseFloat(localStorage.getItem('sustus_flowers_price')||150);}
function savePrice(){localStorage.setItem('sustus_flowers_price',document.getElementById('pricePer').value);}
try{document.getElementById('pricePer').value=getPrice();}catch(e){}
const HARISH={lat:32.45917,lng:35.04278};
const HARISH_STREETS={'ספיר':{lat:32.4605,lng:35.0455},'גפן':{lat:32.4615,lng:35.0435},'הגפן':{lat:32.4615,lng:35.0435},'דרך ארץ':{lat:32.4595,lng:35.0420},'הרימון':{lat:32.4585,lng:35.0445},'השקד':{lat:32.4600,lng:35.0460},'הזית':{lat:32.4580,lng:35.0430},'האלון':{lat:32.4610,lng:35.0470},'כלנית':{lat:32.4575,lng:35.0450},'הכלנית':{lat:32.4575,lng:35.0450}};
function getStreetBase(addr){for(let k in HARISH_STREETS){if(addr.includes(k)) return HARISH_STREETS[k];} return HARISH;}
function fixPhone(raw){if(!raw) return '';let d=String(raw).replace(/\D/g,'');if(d.startsWith('972')) return d;if(d.startsWith('0')) return '972'+d.slice(1);if(d.length===9&&d.startsWith('5')) return '972'+d;if(d.length===10) return '972'+d.slice(1);return d;}
function displayPhone(raw){let d=String(raw||'').replace(/\D/g,'');if(d.startsWith('972')) d='0'+d.slice(3);if(d.length===10) return d.slice(0,3)+'-'+d.slice(3);return raw||'';}
function fixPhones(){parcels.forEach(p=>{p.phone=displayPhone(p.phone);});saveParcels();render();alert('✅ תיקנתי את כל המספרים!');}
function spreadInHarish(){parcels.forEach((p,i)=>{let base=getStreetBase(p.address||'');let numMatch=(p.address||'').match(/(\d+)/);let num=numMatch?parseInt(numMatch[1]):i;p.lat=base.lat+(num%20)*0.0003+(i%3)*0.0002;p.lng=base.lng+Math.floor(num/20)*0.0004+(i%2)*0.0003;p.manual=true;});saveParcels();render();alert('✅ פיזרתי!');}
let map=L.map('map').setView([HARISH.lat,HARISH.lng],15);
let googleRoad=L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{maxZoom:20,attribution:'© Google Maps'});
let googleSat=L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:20,attribution:'© Google Maps'});
let googleHybrid=L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:20,attribution:'© Google Maps'});
googleRoad.addTo(map);let currentLayer=googleRoad;
function setMapType(t){map.removeLayer(currentLayer);document.getElementById('btnRoad').classList.remove('on');document.getElementById('btnSat').classList.remove('on');document.getElementById('btnHybrid').classList.remove('on');if(t==='road'){currentLayer=googleRoad;document.getElementById('btnRoad').classList.add('on');}if(t==='sat'){currentLayer=googleSat;document.getElementById('btnSat').classList.add('on');}if(t==='hybrid'){currentLayer=googleHybrid;document.getElementById('btnHybrid').classList.add('on');}currentLayer.addTo(map);}
let markers=[],line;let fixingIndex=-1;
function googleMapsLink(s){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.address+', ישראל');}
function wazeLink(s){return 'https://waze.com/ul?ll='+s.lat+','+s.lng+'&navigate=yes';}
function drawMap(){markers.forEach(m=>map.removeLayer(m));markers=[];if(line) map.removeLayer(line);let pts=[];parcels.forEach((s,i)=>{let col=s.done?'#25D366':'#ec4899';let ic=L.divIcon({html:'<div style="background:'+col+';color:#fff;width:30px;height:30px;border-radius:50%;text-align:center;line-height:30px;font-weight:800;border:3px solid #fff;font-size:13px">'+(i+1)+'</div>',className:'',iconSize:[30,30]});let m=L.marker([s.lat,s.lng],{icon:ic,draggable:true}).addTo(map);m.on('dragend',function(){let ll=m.getLatLng();s.lat=ll.lat;s.lng=ll.lng;s.manual=true;saveParcels();render();});let waNum=fixPhone(s.phone);m.bindPopup('<b>'+s.name+'</b><br>'+s.address);markers.push(m);pts.push([s.lat,s.lng]);});if(pts.length){line=L.polyline(pts,{color:'#ec4899',weight:4}).addTo(map);}}
map.on('click',function(e){if(fixingIndex>=0){parcels[fixingIndex].lat=e.latlng.lat;parcels[fixingIndex].lng=e.latlng.lng;parcels[fixingIndex].manual=true;saveParcels();render();alert('✅ הועבר!');fixingIndex=-1;document.getElementById('fixHint').textContent='';}});
function setFix(i){fixingIndex=i;document.getElementById('fixHint').textContent='👆 עכשיו לחץ על המפה איפה הבית של '+parcels[i].name;map.setView([HARISH.lat,HARISH.lng],15);}
function openWaze(){let n=parcels.find(s=>!s.done)||parcels[0];if(!n) return alert('אין סחורה');window.open(wazeLink(n),'_blank');}
function getHistory(){try{return JSON.parse(localStorage.getItem('sustus_flowers_history')||'{}');}catch(e){return {};}}
function saveHistory(h){localStorage.setItem('sustus_flowers_history',JSON.stringify(h));}
function recordDone(){let today=new Date().toISOString().slice(0,10);let h=getHistory();h[today]=parcels.filter(p=>p.done).length;saveHistory(h);}
function buildDailyText(){let price=getPrice();let t=parcels.length,d=parcels.filter(p=>p.done).length;let date=new Date().toLocaleDateString('he-IL');return '🌸 דו"ח יומי - סוס-טוס\n📅 '+date+'\n👤 גיא - 052-8671331\n📦 סה"כ: '+t+'\n✅ נמסרו: '+d+'\n💰 סה"כ היום: '+(d*price)+'₪\n\n'+parcels.map((p,i)=>(i+1)+'. '+p.name+' - '+p.address+' '+(p.done?'✅':'⏳')).join('\n');}
function buildMonthlyText(){let h=getHistory();let now=new Date();let ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');let total=0,days=0;for(let k in h){if(k.startsWith(ym)){total+=h[k];days++;}}let price=getPrice();return '🌸 דו"ח חודשי - סוס-טוס\n📅 '+(now.getMonth()+1)+'/'+now.getFullYear()+'\n👤 גיא - 052-8671331\n📦 נמסרו: '+total+'\n💰 סה"כ: '+(total*price)+'₪';}
function sendDailyReport(){recordDone();window.open('https://wa.me/?text='+encodeURIComponent(buildDailyText()),'_blank');}
function sendMonthlyReport(){window.open('https://wa.me/?text='+encodeURIComponent(buildMonthlyText()),'_blank');}
function copyDailyReport(){recordDone();navigator.clipboard.writeText(buildDailyText()).then(()=>alert('✅ הועתק!')).catch(()=>alert(buildDailyText()));}
function addSingle(){let n=document.getElementById('oneName').value.trim(),a=document.getElementById('oneAddr').value.trim(),p=document.getElementById('onePhone').value.trim(),f=document.getElementById('oneFlower').value;if(!n||!a) return alert('צריך שם וכתובת');let base=getStreetBase(a);parcels.push({type:f,name:n,address:a,phone:displayPhone(p),lat:base.lat+Math.random()*0.002,lng:base.lng+Math.random()*0.002,done:false});saveParcels();render();go(1,document.querySelectorAll('.nav div')[0]);}
function bulkAdd(){let txt=document.getElementById('bulkText').value.trim();if(!txt) return alert('הדבק רשימה');let lines=txt.split('\n').filter(l=>l.trim());lines.forEach(l=>{let parts=l.split('|').map(x=>x.trim());let base=getStreetBase(parts[1]||'');parcels.push({type:'סחורת פרחים 🌹',name:parts[0]||'סחורה',address:parts[1]||'',phone:displayPhone(parts[2]||''),lat:base.lat+Math.random()*0.003,lng:base.lng+Math.random()*0.003,done:false});});saveParcels();document.getElementById('bulkText').value='';render();go(1,document.querySelectorAll('.nav div')[0]);}
function clearDay(){if(confirm('למחוק את כל היום?')){recordDone();parcels=[];saveParcels();render();}}
function render(){
saveParcels();let t=parcels.length,d=parcels.filter(s=>s.done).length;
document.getElementById('sTotal').textContent=t;document.getElementById('sDone').textContent=d;document.getElementById('sLeft').textContent=t-d;document.getElementById('progBar').style.width=t?(d/t*100)+'%':'0%';
let price=getPrice();document.getElementById('todayDate').textContent=new Date().toLocaleDateString('he-IL');document.getElementById('monthName').textContent=(new Date().getMonth()+1)+'/'+new Date().getFullYear();
document.getElementById('moneyToday').textContent=(d*price)+'₪';document.getElementById('moneyTodayDetail').textContent=d+' נמסרו × '+price+'₪';
let h=getHistory();let now=new Date();let ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');let mTotal=0;for(let k in h){if(k.startsWith(ym)) mTotal+=h[k];}
let todayKey=now.toISOString().slice(0,10);let todayInHistory=h[todayKey]||0;let monthWithToday=mTotal;if(!h[todayKey]||h[todayKey]!==d){monthWithToday=mTotal-todayInHistory+d;}
document.getElementById('moneyMonth').textContent=(monthWithToday*price)+'₪';document.getElementById('moneyMonthDetail').textContent=monthWithToday+' נמסרו החודש × '+price+'₪';
let hl=document.getElementById('historyList');hl.innerHTML='';let keys=Object.keys(h).sort().reverse().slice(0,7);if(!keys.length) hl.innerHTML='אין היסטוריה עדיין';keys.forEach(k=>{hl.innerHTML+='<div>'+k+' - '+h[k]+' נמסרו - '+(h[k]*price)+'₪</div>';});
let el=document.getElementById('stopsList');el.innerHTML='';if(!t) el.innerHTML='<div class="card" style="text-align:center">אין סחורה - הוסף בלשונית "הוסף"</div>';
parcels.forEach((s,i)=>{
let waNum=fixPhone(s.phone);let disp=displayPhone(s.phone);
el.innerHTML+='<div class="card" style="'+(s.done?'background:#f0fff4':'')+'"><b>'+(i+1)+'. '+s.name+'</b> '+(s.done?'✅ נמסר':'')+'<br><small>'+(s.type||'')+' | '+s.address+' | 📞 '+disp+'</small>'
+'<div class="move"><button onclick="moveUp('+i+')">🔼 למעלה</button><button onclick="moveDown('+i+')">🔽 למטה</button></div>'
+'<a href="tel:+'+waNum+'" class="callBtn">📞 התקשר ל'+s.name+' - '+disp+'</a>'
+'<a href="https://wa.me/'+waNum+'?text='+encodeURIComponent(getMsg(s.name))+'" target="_blank" class="wa">📲 אני בדרך - וואטסאפ ל'+s.name+'</a>'
+'<div class="navBtns"><a href="'+googleMapsLink(s)+'" target="_blank" style="background:#4285F4">🗺️ גוגל מפות</a><a href="'+wazeLink(s)+'" target="_blank" style="background:#33ccff">🚗 Waze</a></div>'
+'<button onclick="setFix('+i+')" style="width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:700">📍 תקן במפה</button>'
+'<div class="btns"><button class="b1" onclick="markDone('+i+')">'+(s.done?'↩ בטל':'✅ נמסר')+'</button><button class="b2" onclick="focusStop('+i+')">📍 במפה</button><button onclick="delItem('+i+')" style="background:#ffe6e6;border:0;padding:9px 12px;border-radius:10px">🗑</button></div></div>';
});
drawMap();
}
function focusStop(i){map.setView([parcels[i].lat,parcels[i].lng],17);if(markers[i]) markers[i].openPopup();}
function markDone(i){parcels[i].done=!parcels[i].done;recordDone();render();}
function moveUp(i){if(i===0) return;let tmp=parcels[i];parcels[i]=parcels[i-1];parcels[i-1]=tmp;render();}
function moveDown(i){if(i===parcels.length-1) return;let tmp=parcels[i];parcels[i]=parcels[i+1];parcels[i+1]=tmp;render();}
function delItem(i){if(confirm('למחוק?')){parcels.splice(i,1);render();}}
function go(n,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));document.getElementById('t'+n).classList.add('on');document.querySelectorAll('.nav div').forEach(d=>d.classList.remove('on'));el.classList.add('on');setTimeout(()=>map.invalidateSize(),200);}
render();
</script>
</body></html>
